name: frontend-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: for file in app-*.js; do node --check "$file"; done
      - run: node --check config.js
      - run: node --check sw.js
      - run: python -m json.tool manifest.webmanifest >/dev/null
      - run: test -f index.html && test -f styles-base.css && test -f styles-ui.css && test -f .do/app.yaml
