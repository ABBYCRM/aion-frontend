name: aion-frontend
region: nyc
static_sites:
  - name: website
    github:
      repo: ABBYCRM/aion-frontend
      branch: main
      deploy_on_push: true
    environment_slug: html
    source_dir: /
    index_document: index.html
    catchall_document: index.html
    headers:
      - name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://aion-backend-v2-jszgl.ondigitalocean.app; img-src 'self' data: blob:; media-src 'self' blob: data:; style-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; manifest-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'"
      - name: X-Frame-Options
        value: DENY
      - name: X-Content-Type-Options
        value: nosniff
      - name: Referrer-Policy
        value: no-referrer
      - name: Permissions-Policy
        value: camera=(), geolocation=(), payment=(), usb=()
      - name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - name: Cache-Control
        value: no-cache
    routes:
      - path: /sw.js
        headers:
          - name: Cache-Control
            value: no-cache, no-store, must-revalidate
          - name: Service-Worker-Allowed
            value: /
      - path: /config.js
        headers:
          - name: Cache-Control
            value: no-cache, no-store, must-revalidate
