name: aion-frontend
region: nyc
static_sites:
  - name: website
    github:
      repo: ABBYCRM/aion-frontend
      branch: main
      deploy_on_push: true
    environment_slug: html
    source_dir: /
    index_document: index.html
    catchall_document: index.html
    headers:
      - name: X-Content-Type-Options
        value: nosniff
      - name: Referrer-Policy
        value: no-referrer
      - name: Permissions-Policy
        value: camera=(), geolocation=(), payment=(), usb=()
      - name: Cache-Control
        value: no-cache
    routes:
      - path: /sw.js
        headers:
          - name: Cache-Control
            value: no-cache, no-store, must-revalidate
          - name: Service-Worker-Allowed
            value: /
      - path: /config.js
        headers:
          - name: Cache-Control
            value: no-cache, no-store, must-revalidate
