# DigitalOcean App Platform spec for the AION frontend (static PWA).
# Deploy from this directory. The static assets live under ../backend/static/
# but DO only needs the files in this app's source dir, so we symlink or copy.
#
# To deploy via doctl CLI:
#   doctl apps create --spec frontend/do-app.yaml
# Then update with:
#   doctl apps update <app-id> --spec frontend/do-app.yaml
name: aion-frontend
region: nyc
static_sites:
  - name: aion
    source_dir: ../backend/static
    output_dir: .
    index_document: index.html
    error_document: index.html
    cors:
      allow_origins:
        - "*"
    headers:
      - name: Cache-Control
        value: "public, max-age=3600"
      - name: Service-Worker-Allowed
        value: "/"
    routes:
      - path: /sw.js
        headers:
          - name: Service-Worker-Allowed
            value: "/"
          - name: Cache-Control
            value: "no-cache"
      - path: /manifest.webmanifest
        headers:
          - name: Content-Type
            value: "application/manifest+json"
      - path: /icon.svg
        headers:
          - name: Content-Type
            value: "image/svg+xml"
    envs:
      - key: AION_BACKEND_URL
        value: https://aion-runtime.onrender.com
        scope: BUILD_TIME
